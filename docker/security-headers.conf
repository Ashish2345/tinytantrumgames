# Included in every location of docker/nginx.conf (nginx drops server-level
# add_header lines as soon as a location adds its own, so they live here).
#
# Strict-Transport-Security is deliberately NOT set: this container only speaks
# plain http to the front nginx, which terminates TLS and sends HSTS itself.
include /etc/nginx/snippets/csp.conf;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
