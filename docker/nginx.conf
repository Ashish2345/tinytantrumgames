# nginx inside the tinytantrum container: serves the built static site on :80.
# TLS, HSTS and the public hostname are handled by the front nginx in the
# deploy stack; this server answers any Host it is given.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # Behind the TLS proxy: keep the /color-pour -> /color-pour/ redirect
    # relative, or it would point at http://tinytantrum/... inside the network.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # CSS, JS, images and videos carry a ?v=<content hash> from the build, so
    # they can be cached for a year; a changed file gets a new URL. Fonts never
    # change. Videos support range requests out of the box.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /app-ads.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        default_type text/plain;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Pages: always revalidated, so a deploy shows up on the next visit.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
